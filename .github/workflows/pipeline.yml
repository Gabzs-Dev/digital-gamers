
name: Pipeline Digital Gamers

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # STAGE 1 - BUILD
  build:
    name: Build da aplicação
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Compilar aplicação
        run: npm run build

      - name: Armazenar build
        uses: actions/upload-artifact@v4
        with:
          name: digital-gamers-build
          path: dist/
          if-no-files-found: error

  # STAGE 2 - TEST
  test:
    name: Testes e cobertura
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Verificar cobertura
        run: npm run test:coverage

      - name: Armazenar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digital-gamers-coverage
          path: coverage/
          if-no-files-found: ignore

  # STAGE 3 - ARTIFACT
  artifact:
    name: Gerar artefato versionado
    runs-on: ubuntu-latest
    needs:
      - build
      - test

    steps:
      - name: Baixar build
        uses: actions/download-artifact@v4
        with:
          name: digital-gamers-build
          path: dist/

      - name: Armazenar artefato final
        uses: actions/upload-artifact@v4
        with:
          name: digital-gamers-v1.0.0-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
